<header class="app-header">
  <nav class="max-w-6xl mx-auto px-4 flex items-center gap-3 sm:gap-6">
    <span class="font-semibold text-lg py-3">{{ title }}</span>
    @if (hasTeam()) {
      <p-tabs [value]="activeTab()" (valueChange)="navigate($event)" class="self-end">
        <p-tablist>
          @for (tab of tabs; track tab.route) {
            <p-tab [value]="tab.route" class="flex items-center !gap-2" [attr.aria-label]="tab.label">
              <i [class]="tab.icon"></i>
              <!-- Icons only on phones, so all the tabs fit beside the title. -->
              <span class="hidden sm:inline">{{ tab.label }}</span>
            </p-tab>
          }
        </p-tablist>
      </p-tabs>
    }
    <div class="ml-auto flex items-center gap-1" [class.invisible]="restoring()">
      @if (hasTeam()) {
        <app-settings-menu />
      }
      <p-button
        class="import-button"
        [ariaLabel]="hasTeam() ? 'Change team' : 'Import'"
        [label]="hasTeam() ? 'Change team' : 'Import'"
        icon="pi pi-download"
        [text]="true"
        size="small"
        (onClick)="goToImport()"
      />
    </div>
  </nav>
</header>

<!-- Held back while the last team is restored, so pages don't flash "No team imported yet". -->
@if (restoring()) {
  <div class="flex flex-col items-center gap-3 mt-16 text-surface-500">
    <p-progress-spinner ariaLabel="Loading your team" />
    <span class="text-sm">Loading your team…</span>
  </div>
} @else {
  <router-outlet></router-outlet>
}
