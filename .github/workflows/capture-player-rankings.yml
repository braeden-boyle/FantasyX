name: Capture player rankings

# Saves the league's player rankings in both projection modes every Wednesday at 14:00 UTC through
# the season, for a later backtest of value against actual scores (docs/PLAN.md, v1.9). By then ESPN
# has moved to the new week, most leagues have processed waivers, and Thursday's game is still a day
# away. The first save for a week wins, so a manual re-run later in the week only fills a gap.
#
# Repository secrets: FANTASYX_DB_CONNECTION (Supabase's session-pooler string), FANTASYX_LEAGUE_ID,
# ESPN_S2 and ESPN_SWID (a private league's cookies; update them by hand when ESPN expires them), and
# SNAPSHOT_CAPTURE_KEY. GitHub only runs schedules from main, and turns them off after 60 days
# without repository activity, so it may need turning back on before a season.
on:
  schedule:
    - cron: '0 14 * 9-12,1 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-player-rankings
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the capture script's dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the backend
        working-directory: backend
        run: dotnet build -c Release

      # Run from backend/ so it finds appsettings.json, and as the app itself (not dotnet run) so the
      # saved process id is the one to stop.
      - name: Start the backend
        working-directory: backend
        env:
          ConnectionStrings__FantasyX: ${{ secrets.FANTASYX_DB_CONNECTION }}
          Snapshots__CaptureKey: ${{ secrets.SNAPSHOT_CAPTURE_KEY }}
          ASPNETCORE_URLS: ${{ env.API_URL }}
        run: |
          nohup dotnet bin/Release/net8.0/FantasyX.Backend.dll > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"

      - name: Wait for the backend
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null "$API_URL/"; then exit 0; fi
            sleep 2
          done
          echo "The backend didn't start." >&2
          exit 1

      - name: Capture this week's rankings
        working-directory: frontend
        env:
          LEAGUE_ID: ${{ secrets.FANTASYX_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.ESPN_SWID }}
          CAPTURE_KEY: ${{ secrets.SNAPSHOT_CAPTURE_KEY }}
        run: npm run capture:rankings

      - name: Show the backend's log
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/backend.log"

      - name: Stop the backend
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || true
